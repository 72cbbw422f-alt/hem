name: iOS build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "HEMMA/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for device
        run: xcodebuild -project HEMMA.xcodeproj -scheme HEMMA -sdk iphoneos -configuration Debug CODE_SIGNING_ALLOWED=NO build
