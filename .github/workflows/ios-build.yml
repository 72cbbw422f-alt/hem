name: iOS build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "HEMMA/**"
      - "HEMMAWidget/**"
      - "Scripts/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Generate Hemma app icon
        run: swift Scripts/generate_app_icon.swift
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for device
        run: xcodebuild -project HEMMA.xcodeproj -scheme HEMMA -sdk iphoneos -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify compiled app icon
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/HEMMA.app"
          test -s "$APP_PATH/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP_PATH/Info.plist" | grep -Fx "AppIcon"
      - name: Verify embedded widget
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/HEMMA.app"
          test -d "$APP_PATH/PlugIns/HEMMAWidget.appex"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$APP_PATH/PlugIns/HEMMAWidget.appex/Info.plist" | grep -Fx "com.apple.widgetkit-extension"
      - name: Verify full-resolution launch screen
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/HEMMA.app"
          test -d "$APP_PATH/LaunchScreen.storyboardc"
          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$APP_PATH/Info.plist" | grep -Fx "LaunchScreen"
          /usr/libexec/PlistBuddy -c "Print :UIRequiresFullScreen" "$APP_PATH/Info.plist" | grep -Fx "true"
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/HEMMA.app build/Payload/
          cd build
          /usr/bin/zip -qry HEMMA-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HEMMA-unsigned-IPA
          path: build/HEMMA-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
