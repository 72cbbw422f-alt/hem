name: iOS build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "HEMMA/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for device
        run: xcodebuild -project HEMMA.xcodeproj -scheme HEMMA -sdk iphoneos -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/HEMMA.app build/Payload/
          cd build
          /usr/bin/zip -qry HEMMA-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HEMMA-unsigned-IPA
          path: build/HEMMA-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
