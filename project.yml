name: HEMMA
options:
  bundleIdPrefix: se.hemma
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  HEMMA:
    type: application
    platform: iOS
    sources:
      - path: HEMMA
    info:
      path: HEMMA/Resources/Info.plist
    entitlements:
      path: HEMMA/HEMMA.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.hemma.app
        PRODUCT_NAME: HEMMA
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHomeKitUsageDescription: "HEMMA behöver åtkomst till ditt hem för att visa och styra dina kompatibla tillbehör."
        CODE_SIGN_ENTITLEMENTS: HEMMA/HEMMA.entitlements
        SWIFT_VERSION: "5.0"
