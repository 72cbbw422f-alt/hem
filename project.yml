name: HEMMA
options:
  bundleIdPrefix: se.hemma
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  HEMMA:
    type: application
    platform: iOS
    sources:
      - path: HEMMA
    info:
      path: HEMMA/Resources/Info.plist
      properties:
        NSHomeKitUsageDescription: "HEMMA behöver åtkomst till ditt hem för att visa och styra dina kompatibla tillbehör."
        CFBundleURLTypes:
          - CFBundleURLName: se.hemma.app
            CFBundleURLSchemes:
              - hemma
    entitlements:
      path: HEMMA/HEMMA.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.hemma.app
        PRODUCT_NAME: HEMMA
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: HEMMA/HEMMA.entitlements
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: HEMMAWidget
        embed: true
  HEMMAWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HEMMAWidget
    info:
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.hemma.app.widget
        PRODUCT_NAME: HEMMAWidget
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
